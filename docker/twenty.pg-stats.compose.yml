# Opt-in pg_stat_statements overlay for the Twenty Postgres. Added only when HARNESS_PG_STATS=1
# (src/adapters/pg-stats.ts). Base: <twenty>/packages/twenty-docker/docker-compose.yml, service db
# (the fork sets no command there, so this overlay does not replace one).
services:
  db:
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on"]
