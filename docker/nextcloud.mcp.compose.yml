# Adds the Nextcloud MCP server in multi-user pass-through mode (ADR 0006, decision D9). The server holds no Nextcloud
# credential. Each MCP client sends its own app password as Basic auth, and the server passes it through to Nextcloud.
# Use it only together with docker/nextcloud.compose.yml (same project).
services:
  mcp:
    image: ghcr.io/cbcoutinho/nextcloud-mcp-server:0.213.2@sha256:655c2864b48fd3f0696480ebe19a165ff114a582b30b9cec1d6ab4923586d325
    networks:
      default: {}
      p4:
        aliases:
          - nextcloud-mcp
    depends_on:
      app:
        condition: service_started
    ports:
      - "127.0.0.1:8765:8000"
    environment:
      NEXTCLOUD_HOST: http://app
      MCP_DEPLOYMENT_MODE: multi_user_basic

networks:
  p4:
    external: true
    name: qa-harness-p4
