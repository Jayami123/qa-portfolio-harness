# Opt-in overlay, added only when DOCUMENSO_OIDC=1 (src/adapters/documenso-oidc.ts, src/adapters/documenso.adapter.ts).
# Keycloak 26.5.0 (official image, pinned by tag and digest) as the test OIDC provider on 127.0.0.1:8081.
# The realm file (docker/documenso-oidc/qa-realm.json) holds no secret and no password. The adapter sets the client
# secret, the redirect URI and the two user passwords through the admin REST API after the realm imports.
# DOCUMENSO_OIDC_ADMIN_PASSWORD is generated per run by the adapter and passed through the process env (never written).
#
#   docker compose -p qa-harness-documenso -f docker/documenso.compose.yml -f docker/documenso.oidc.compose.yml up -d --wait

services:
  oidc:
    image: quay.io/keycloak/keycloak:26.5.0@sha256:5fdd7cda82e58775ed124294c7e16fabc33166d38dfc4aabebda7d64e7a964bf
    container_name: qa-harness-documenso-oidc
    command: ["start-dev", "--import-realm", "--hostname=http://127.0.0.1:8081", "--hostname-strict=false", "--http-enabled=true"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${DOCUMENSO_OIDC_ADMIN_PASSWORD}
    volumes:
      - ./documenso-oidc/qa-realm.json:/opt/keycloak/data/import/qa-realm.json:ro
    ports:
      - "127.0.0.1:8081:8080"
