# Harness overlay for Cal API v2 Redis.
# Merged after docker/cal.compose.yml in the qa-harness-cal project. Host port 6381 is free; 6380 is Medusa's
# (docker/medusa.redis.compose.yml). The API reads REDIS_URL from its spawn env, not from a file.
services:
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
