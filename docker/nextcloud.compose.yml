# Harness-owned Nextcloud stack (ADR 0006). The database and owner passwords are generated per run by the adapter and
# passed in through the environment. No password is written in this file.
#
#   node scripts/up.mjs nextcloud   (starts this file, then docker/nextcloud.mcp.compose.yml)
name: qa-harness-nextcloud

services:
  db:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set by the adapter}
      POSTGRES_DB: nextcloud
    ports:
      - "127.0.0.1:5460:5432"
    volumes:
      - nextcloud_harness_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextcloud -d nextcloud"]
      interval: 5s
      timeout: 5s
      retries: 40

  app:
    image: nextcloud:35.0.3-apache@sha256:8a7a65b8bae82a79568fec2ed9cf3e374a1944eda2a22ebe130d79463336fee3
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: nextcloud
      POSTGRES_USER: nextcloud
      POSTGRES_PASSWORD: ${NEXTCLOUD_DB_PASSWORD:?set by the adapter}
      NEXTCLOUD_ADMIN_USER: qa-owner
      NEXTCLOUD_ADMIN_PASSWORD: ${NEXTCLOUD_OWNER_PASSWORD:?set by the adapter}
      # 10.0.2.2 is the Android emulator's alias for the host, so an emulator reaches the published app at http://10.0.2.2:8080.
      NEXTCLOUD_TRUSTED_DOMAINS: "127.0.0.1 localhost app 10.0.2.2"
    volumes:
      - nextcloud_harness_data:/var/www/html

volumes:
  nextcloud_harness_pg: {}
  nextcloud_harness_data: {}
