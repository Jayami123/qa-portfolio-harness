# Harness-owned Mattermost stack (ADR 0006). The database and admin/agent passwords are generated per run by the adapter.
# The MCP server is the standalone binary built from a pinned commit (development-only upstream; see ADR 0006). It binds
# to 127.0.0.1 on the host only. Nothing secret is written in this file.
#
#   node scripts/up.mjs mattermost
name: qa-harness-mattermost

services:
  db:
    image: postgres:16-alpine@sha256:81e77a4833487b8132fe4b00bedd39dc3f74b8641e387f19312a48f7de218c2e
    environment:
      POSTGRES_USER: mattermost
      POSTGRES_PASSWORD: ${MATTERMOST_DB_PASSWORD:?set by the adapter}
      POSTGRES_DB: mattermost
    ports:
      - "127.0.0.1:5463:5432"
    volumes:
      - mattermost_harness_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mattermost -d mattermost"]
      interval: 3s
      timeout: 3s
      retries: 40

  app:
    image: mattermost/mattermost-team-edition:12.1.0@sha256:35927b9c535a9eb74f0e45385d3fe5d8308b16e0464031f157a834da8af3ee73
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8065:8065"
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost:${MATTERMOST_DB_PASSWORD:?set by the adapter}@db:5432/mattermost?sslmode=disable&connect_timeout=10
      MM_SERVICESETTINGS_SITEURL: http://127.0.0.1:8065
      MM_SERVICESETTINGS_LISTENADDRESS: ":8065"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: "true"
      MM_TEAMSETTINGS_ENABLEOPENSERVER: "false"

  mcp:
    build:
      # The adapter fills this folder per run: the Dockerfile and extra-ca.pem (see mattermost-env.ts).
      context: ${MATTERMOST_BUILD_CONTEXT:?set by the adapter}
      dockerfile: mattermost-mcp.Dockerfile
      args:
        MM_AGENTS_COMMIT: 96ecd17ce4d4b6cbcec1abcd2a9173759b4e85e1
    image: p4-harness/mattermost-mcp:96ecd17
    networks:
      default: {}
      p4:
        aliases:
          - mattermost-mcp
    depends_on:
      - app
    # The binary binds 0.0.0.0 inside the container (the host port stays on 127.0.0.1). --site-url is required then.
    command:
      - --transport
      - http
      - --http-port
      - "8066"
      - --http-bind-addr
      - 0.0.0.0
      - --site-url
      - http://127.0.0.1:8066
      - --server-url
      - http://127.0.0.1:8065
      - --internal-server-url
      - http://app:8065
    ports:
      - "127.0.0.1:8066:8066"

volumes:
  mattermost_harness_pg: {}

networks:
  p4:
    external: true
    name: qa-harness-p4
