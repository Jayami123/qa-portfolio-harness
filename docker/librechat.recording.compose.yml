# Opt-in MCP recording (H9). Used only with LIBRECHAT_MCP_RECORDING=1, after docker/librechat.compose.yml (see
# src/adapters/librechat-recording.ts). The recorder sits between LibreChat and each MCP server: it forwards bytes unchanged
# and writes a redacted JSON line per request and response to its stdout. Read the log with:
#   docker logs qa-harness-librechat-mcp-recorder-1
# The recorder publishes no port. It joins the shared network qa-harness-p4 with the alias mcp-recorder.
#
# The image is node:22-alpine, pinned by digest (docs/pins/p4.md). The recorder code is the compiled dist/mcp-recorder
# folder of this repo, mounted read-only. No secret is passed to this service.
services:
  mcp-recorder:
    image: node:22-alpine@sha256:1314fb30ec37592d5845e5a160d522c0e680972aa534549940b8d73bde88481a
    command: ["node", "/recorder/dist/mcp-recorder/main.js"]
    user: "node"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    environment:
      MCP_RECORDER_ROUTES: ${MCP_RECORDER_ROUTES:?set by the adapter}
      MCP_RECORDER_PORT: "9100"
    volumes:
      - ${MCP_RECORDER_DIST:?set by the adapter}:/recorder/dist:ro
      - ${MCP_RECORDER_PACKAGE_JSON:?set by the adapter}:/recorder/package.json:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9100/healthz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
    networks:
      p4:
        aliases:
          - mcp-recorder

  app:
    depends_on:
      mcp-recorder:
        condition: service_healthy

networks:
  p4:
    external: true
    name: qa-harness-p4
