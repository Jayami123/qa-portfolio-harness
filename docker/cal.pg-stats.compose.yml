# Opt-in pg_stat_statements overlay for the Cal Postgres. Added only when HARNESS_PG_STATS=1
# (src/adapters/pg-stats.ts). Base: <cal>/packages/prisma/docker-compose.yml, service postgres
# (the fork sets no command there, so this overlay does not replace one).
services:
  postgres:
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "track_io_timing=on"]
