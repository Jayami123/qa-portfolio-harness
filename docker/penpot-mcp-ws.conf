# Harness-owned nginx overlay for the Penpot frontend (ADR 0006). The MCP plugin connects to /mcp/ws on the page's own
# origin, and the Penpot image does not proxy that path, so this file proxies it to the MCP server's WebSocket on 4402.
# Mounted at /etc/nginx/overrides/server.d/. It must not be placed in location.d (that include sits inside `location /`).
location /mcp/ws {
    proxy_pass http://mcp:4402/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 3600s;
}
