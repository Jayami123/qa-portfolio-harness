# Opt-in overlay, added only when DOCUMENSO_GOTENBERG=1 (see src/adapters/documenso.adapter.ts).
# Gotenberg converts DOCX uploads to PDF for Documenso. Pinned by digest. Published on 127.0.0.1 only.
#
#   docker compose -p qa-harness-documenso -f docker/documenso.compose.yml -f docker/documenso.gotenberg.compose.yml up -d --wait

services:
  gotenberg:
    image: gotenberg/gotenberg:8@sha256:13672f317b443c793e972b1bd2155ec62a3e7b6891b411e8196442cc053ee5f5
    container_name: qa-harness-documenso-gotenberg
    ports:
      - "127.0.0.1:3010:3000"
