# Dependency bumps change what consumers get on the NEXT tag only.
# Runtime dependency bumps (pg, zod, dotenv, @faker-js/faker) need a CHANGELOG line in the next release.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      timezone: Asia/Colombo
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      npm-minor-patch:
        applies-to: version-updates
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      timezone: Asia/Colombo
      interval: weekly
      day: monday
      time: "06:00"
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    open-pull-requests-limit: 5
