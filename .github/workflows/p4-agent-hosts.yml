# P4 agent hosts (ADR 0007): LiteLLM, LibreChat and OpenClaw, with the Part A products they reach, in stub mode only.
# One job starts the full set on the qa-harness-p4 network, waits for readiness, checks the loopback binds, measures
# memory and disk, and uploads only the RAM report. Advisory, not a required check (review answer 0.2: full set first; the
# split is a documented fallback). No GEMINI_API_KEY and no Gemma call. .harness/ (run-state credentials) is never uploaded.
name: P4 agent hosts

on:
  workflow_dispatch:
    inputs:
      tool_approval:
        description: "Turn on LIBRECHAT_TOOL_APPROVAL=1 (ask nc_contacts_list_addressbooks, deny nc_contacts_delete_addressbook) and run the live H3 check"
        type: boolean
        default: false
      second_identity:
        description: "Turn on P4_SECOND_IDENTITY=1 (H2, all five servers), P4_SECOND_POSTS=1 (H7, Mattermost posts from the second user) and P4_MAIL=1 (H1, GreenMail and the Nextcloud Mail app for both users)"
        type: boolean
        default: false
  pull_request:
    paths:
      - "src/adapters/litellm*"
      - "src/adapters/librechat*"
      - "src/adapters/openclaw*"
      - "src/adapters/llm-run-state*"
      - "src/adapters/registry.ts"
      - "src/internal/p4-network*"
      - "src/config.ts"
      - "src/types.ts"
      - "docker/litellm*"
      - "docker/librechat*"
      - "docker/openclaw*"
      - "docker/nextcloud*"
      - "docker/greenmail*"
      - "src/adapters/greenmail*"
      - "src/adapters/nextcloud-mail*"
      - "src/adapters/mcp-call*"
      - "docker/outline*"
      - "docker/penpot*"
      - "docker/mattermost*"
      - "docker/twenty*.yml"
      - "scripts/p4-*"
      - "scripts/penpot-plugin-tabs.mjs"
      - "scripts/live/mail.mjs"
      - "scripts/lib.mjs"
      - "docs/pins/p4.md"
      - ".github/workflows/p4-agent-hosts.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  full-set:
    name: agent hosts and five products, readiness, bind check and RAM
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      P4_LLM_MODE: stub
      # Twenty's MCP is opt-in. The probe script also sets TWENTY_MCP=1 for the Twenty step.
      TWENTY_MCP: "1"
      # LibreChat attaches the five Part A MCP servers. Each product is started before librechat (see the probe order).
      LIBRECHAT_MCP_PRODUCTS: "nextcloud,outline,twenty,penpot,mattermost"
      # H2 and H3 options. Each is off unless its dispatch input is true (the empty string is the off value).
      P4_SECOND_IDENTITY: ${{ inputs.second_identity && '1' || '' }}
      # H7 needs H2 (the posts are written by the second identity), so it follows the same dispatch input.
      P4_SECOND_POSTS: ${{ inputs.second_identity && '1' || '' }}
      # H6 needs H2 (one tab per H2 profile). The browser tabs run Playwright's Chromium, installed below.
      P4_PENPOT_PLUGIN: ${{ inputs.second_identity && '1' || '' }}
      # H1 (GreenMail and the Nextcloud Mail app) follows the same dispatch input: qa-owner, and qa-user-b when H2 is on.
      P4_MAIL: ${{ inputs.second_identity && '1' || '' }}
      LIBRECHAT_TOOL_APPROVAL: ${{ inputs.tool_approval && '1' || '' }}
      LIBRECHAT_TOOL_APPROVAL_ASK: ${{ inputs.tool_approval && 'mcp:nextcloud:nc_contacts_list_addressbooks' || '' }}
      LIBRECHAT_TOOL_APPROVAL_DENY: ${{ inputs.tool_approval && 'mcp:nextcloud:nc_contacts_delete_addressbook' || '' }}
      # The H3 fixture stub runs on the runner host; LiteLLM reaches it through host.docker.internal.
      P4_STUB_API_BASE: ${{ inputs.tool_approval && 'http://host.docker.internal:9099/v1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Free runner disk space
        run: |
          set -euo pipefail
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Install harness, clone the Twenty fork at its pin, build
        run: |
          set -euo pipefail
          npm ci
          HARNESS_PRODUCTS=twenty bash scripts/cloud-install.sh
          npm run build

      # H6 only: the Chromium that scripts/penpot-plugin-tabs.mjs drives. The version is the playwright package's (pinned).
      - name: Install the pinned Playwright Chromium (second_identity only)
        if: inputs.second_identity
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Check the probe script syntax
        run: |
          set -euo pipefail
          bash -n scripts/p4-ram-probe.sh

      - name: Start, wait for readiness, check binds, measure memory and disk
        run: |
          set -euo pipefail
          P4_RAM_OUT="evidence/ram-probe-full.json" bash scripts/p4-ram-probe.sh litellm nextcloud outline twenty penpot mattermost librechat openclaw

      - name: Start the H3 approval fixture (tool_approval only)
        if: inputs.tool_approval
        run: |
          set -euo pipefail
          mkdir -p evidence
          APPROVAL_STUB_PORT=9099 nohup node scripts/live/approval-stub.mjs > evidence/approval-stub.log 2>&1 &
          for _ in $(seq 1 30); do curl -sf http://127.0.0.1:9099/stats >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:9099/stats >/dev/null

      # The probe above starts and stops every product itself (its EXIT trap runs `down`, which removes the run-state
      # files). The H3 check needs its own stack, so it is started here and torn down after the check.
      - name: "H3 stack up (tool_approval only): nextcloud, litellm, librechat with the approval rules"
        if: inputs.tool_approval
        env:
          LIBRECHAT_MCP_PRODUCTS: nextcloud
        run: |
          set -euo pipefail
          npm run up -- nextcloud
          npm run up -- litellm
          npm run up -- librechat

      - name: "Live H3 check (tool_approval only): ask pauses and resumes, deny never runs"
        if: inputs.tool_approval
        env:
          LIBRECHAT_MCP_PRODUCTS: nextcloud
        run: |
          set -euo pipefail
          mkdir -p evidence
          node scripts/live/librechat-approval.mjs "$PWD" | tee evidence/h3-live-check.txt

      - name: "H3 stack down (tool_approval only)"
        if: always() && inputs.tool_approval
        env:
          LIBRECHAT_MCP_PRODUCTS: nextcloud
        run: |
          npm run down -- librechat || true
          npm run down -- litellm || true
          npm run down -- nextcloud || true

      - name: Stop the H3 approval fixture
        if: always() && inputs.tool_approval
        run: pkill -f scripts/live/approval-stub.mjs || true

      # H2 (second_identity only). The probe above stops every product it started, so the H2 check gets its own stack for
      # the five MCP products. P4_SECOND_IDENTITY=1 is set at job level; each adapter then seeds its second identity.
      - name: "H2 stack up (second_identity only): nextcloud, outline, twenty, penpot, mattermost"
        if: inputs.second_identity
        run: |
          set -euo pipefail
          npm run up -- nextcloud
          npm run up -- outline
          npm run up -- twenty
          npm run up -- penpot
          npm run up -- mattermost

      - name: "Live H2 check (second_identity only): two identities per server, separate users, the MCP accepts both"
        if: inputs.second_identity
        run: |
          set -euo pipefail
          mkdir -p evidence
          node scripts/live/second-identity.mjs nextcloud outline twenty penpot mattermost | tee evidence/h2-live-check.txt
          node scripts/live/mattermost-posts.mjs | tee evidence/h7-live-check.txt

      # H1: the Nextcloud stack above was started with P4_MAIL=1. The owner sends to self and qa-user-b sends to the second
      # identity; GreenMail must store each message, and the MCP inbox of the recipient must list it after a Mail sync.
      - name: "Live H1 check (second_identity only): the Mail app sends through GreenMail and nc_mail_* lists the inbox"
        if: inputs.second_identity
        run: |
          set -euo pipefail
          mkdir -p evidence
          node scripts/live/mail.mjs | tee evidence/h1-live-check.txt

      # H6: the two tabs were opened by `up -- penpot` (P4_PENPOT_PLUGIN=1). This step prints the result to the step log.
      - name: "Live H6 check (second_identity only): the MCP answers through each open tab with its own profile's file"
        if: inputs.second_identity
        run: |
          set -euo pipefail
          node scripts/live/penpot-plugin.mjs

      - name: "H2 stack down (second_identity only)"
        if: always() && inputs.second_identity
        run: |
          for product in mattermost penpot twenty outline nextcloud; do
            npm run down -- "$product" || true
          done

      - name: Upload H2 evidence (second_identity only)
        if: always() && inputs.second_identity
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: h2-live-check
          path: |
            evidence/h1-live-check.txt
            evidence/h2-live-check.txt
            evidence/h7-live-check.txt
          if-no-files-found: warn
          retention-days: 30

      - name: Upload RAM evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ram-probe-full
          path: evidence/ram-probe-full.json
          if-no-files-found: warn
          retention-days: 30

      - name: No harness containers left
        if: always()
        run: |
          set -euo pipefail
          docker ps -a --filter name=qa-harness --format '{{.Names}}' | tee left.txt
          test ! -s left.txt
